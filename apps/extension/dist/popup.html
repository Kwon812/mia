<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Project NA</title>
    <!--
      MV3 확장 페이지의 기본 CSP 는 인라인 <script> 를 금지한다 — 모든 로직은
      popup.js 에 있다. 인라인 <style> 은 허용되므로 스타일만 여기 둔다.
      popup.js 는 vite 가 src/popup.ts 를 단일 파일로 빌드한 결과다.
    -->
    <style>
      :root {
        --bg: #ffffff;
        --fg: #16181d;
        --sub: #6b7280;
        --faint: #9aa1ad;
        --rule: #e7e8ec;
        --sunken: #f4f5f7;
        --live: #146c66;
        --live-bg: #e3efed;
        --warn: #a9600f;
        --drop: #97363a;
        --drop-bg: #f6e7e7;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #12151a;
          --fg: #e9ebef;
          --sub: #8d94a1;
          --faint: #6b727e;
          --rule: #252b34;
          --sunken: #1a1f27;
          --live: #5dbcb1;
          --live-bg: #142826;
          --warn: #e4a05a;
          --drop: #df868a;
          --drop-bg: #2a1a1c;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        width: 320px;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI",
          "Malgun Gothic", sans-serif;
        font-size: 13px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      #app {
        display: flex;
        flex-direction: column;
      }

      /* ── 헤더 ── */

      .head {
        padding: 14px 16px 12px;
        border-bottom: 1px solid var(--rule);
      }

      .head-main {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .head-cat {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex: none;
      }

      .dot-live {
        background: var(--live);
      }

      .dot-idle {
        background: var(--faint);
      }

      .head-sub {
        margin-top: 3px;
        font-size: 12px;
        color: var(--sub);
        font-variant-numeric: tabular-nums;
      }

      /* ── 새 키 발급 경고 ── */

      .notice {
        padding: 12px 16px 13px;
        background: var(--drop-bg);
        border-bottom: 1px solid var(--rule);
      }

      .notice-t {
        font-weight: 700;
        color: var(--drop);
        margin-bottom: 4px;
      }

      .notice-s {
        font-size: 12px;
        color: var(--sub);
        line-height: 1.55;
      }

      .notice-actions {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }

      .btn {
        flex: 1;
        padding: 6px 8px;
        font: inherit;
        font-size: 12px;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--rule);
        border-radius: 6px;
        cursor: pointer;
      }

      .btn:hover {
        border-color: var(--faint);
      }

      .btn-main {
        font-weight: 650;
        color: var(--bg);
        background: var(--drop);
        border-color: var(--drop);
      }

      .btn-main:hover {
        opacity: 0.88;
      }

      /* ── 전송 미리보기 ── */

      .verdict {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--rule);
      }

      .verdict-ok {
        background: var(--live-bg);
      }

      .verdict-skip {
        background: var(--drop-bg);
      }

      .verdict-k {
        font-size: 11px;
        color: var(--sub);
      }

      .verdict-v {
        font-size: 13px;
        font-weight: 700;
        text-align: right;
      }

      .verdict-ok .verdict-v {
        color: var(--live);
      }

      .verdict-skip .verdict-v {
        color: var(--drop);
      }

      /* ── 지표 ── */

      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        background: var(--rule);
        border-bottom: 1px solid var(--rule);
      }

      .stat {
        background: var(--bg);
        padding: 9px 16px;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .stat-k {
        font-size: 10.5px;
        color: var(--faint);
      }

      .stat-v {
        font-size: 15px;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
      }

      /* ── 블록 ── */

      .block {
        padding: 11px 16px;
        border-bottom: 1px solid var(--rule);
      }

      .block-h {
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
        margin-bottom: 7px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 2px 0;
      }

      .row-k {
        color: var(--sub);
      }

      .row-v {
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .row-warn {
        color: var(--warn);
        font-weight: 600;
      }

      /* ── 도메인 막대 ── */

      .bar-row {
        display: grid;
        grid-template-columns: 96px 1fr 40px;
        align-items: center;
        gap: 8px;
        padding: 3px 0;
      }

      .bar-k {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
      }

      .bar {
        height: 5px;
        background: var(--sunken);
        border-radius: 3px;
        overflow: hidden;
      }

      .bar-fill {
        height: 100%;
        background: var(--live);
        opacity: 0.75;
      }

      .bar-v {
        font-size: 11px;
        color: var(--sub);
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      /* ── 태그 ── */

      .marks {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--rule);
      }

      .tag {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--drop-bg);
        color: var(--drop);
      }

      .tag-quiet {
        background: var(--sunken);
        color: var(--sub);
      }

      /* ── 빈 상태 ── */

      .empty {
        padding: 30px 20px 26px;
        text-align: center;
      }

      .empty-mark {
        font-size: 22px;
        color: var(--faint);
        line-height: 1;
        margin-bottom: 10px;
      }

      .empty-t {
        font-weight: 650;
        margin-bottom: 4px;
      }

      .empty-s {
        font-size: 12px;
        color: var(--sub);
      }

      /* ── 푸터 ── */

      .foot {
        padding: 10px 16px 12px;
        background: var(--sunken);
      }

      .foot-row {
        font-size: 11px;
        color: var(--sub);
        font-variant-numeric: tabular-nums;
      }

      .foot-warn {
        color: var(--warn);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
