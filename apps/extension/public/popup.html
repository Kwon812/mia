<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Project NA</title>
    <!--
      MV3 확장 페이지의 기본 CSP 는 인라인 <script> 를 금지한다 — 모든 로직은
      popup.js 에 있다. 인라인 <style> 은 허용되므로 스타일만 여기 둔다.
      popup.js 는 vite 가 src/popup.ts 를 단일 파일로 빌드한 결과다.
    -->
    <style>
      :root {
        --bg: #ffffff;
        --fg: #16181d;
        --sub: #6b7280;
        --faint: #9aa1ad;
        --rule: #e7e8ec;
        --sunken: #f4f5f7;
        --live: #146c66;
        --live-bg: #e3efed;
        --warn: #a9600f;
        --drop: #97363a;
        --drop-bg: #f6e7e7;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #12151a;
          --fg: #e9ebef;
          --sub: #8d94a1;
          --faint: #6b727e;
          --rule: #252b34;
          --sunken: #1a1f27;
          --live: #5dbcb1;
          --live-bg: #142826;
          --warn: #e4a05a;
          --drop: #df868a;
          --drop-bg: #2a1a1c;
        }
      }

      * {
        box-sizing: border-box;
      }

      /* **폭은 html 에도 줘야 한다.** 크롬은 팝업 크기를 body 가 아니라
         문서 요소(html) 기준으로 재는데, html 에 폭이 없으면 뷰포트만큼
         늘어난 채로 측정돼 "얼마가 필요한지 모르겠다"가 된다. 그러면
         팝업이 상한인 800px 로 벌어지고, 내용 오른쪽에 200px 넘는 흰
         여백이 남는다 — 실측에서 body.scrollWidth 는 580 인데
         html.scrollWidth 가 900 이었다. */
      html,
      body {
        margin: 0;
        padding: 0;
        /* 두 칸이다 — 왼쪽 세션, 오른쪽 사용량. 320px 에 둘을 넣으면 도메인
           막대도 금액도 다 뭉개져서, 한눈에 보려고 나눈 것이 되레 안 보인다.
           크롬 팝업 상한은 800px 이라 여유가 있다. */
        width: 580px;
      }

      body {
        /* 최소 높이가 없으면 내용이 비었을 때 팝업이 납작하게 쭈그러든다.
           서비스 워커가 잠들었거나 크롬이 방금 재시작한 직후가 그렇다 —
           고장난 것처럼 보이는데 실은 스냅샷을 못 받은 것뿐이다. */
        min-height: 180px;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI",
          "Malgun Gothic", sans-serif;
        font-size: 13px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      #app {
        display: flex;
        flex-direction: column;
      }

      /* 신원 경고(#notice)는 이 위에 **가로로 꽉 차게** 남는다 — 한쪽 칸에
         밀어 넣으면 "이 아래 숫자가 다 엉뚱한 계정 것"이라는 말이 한쪽
         얘기처럼 읽힌다. */
      .cols {
        display: flex;
        align-items: stretch;
      }

      #session {
        flex: 1;
        /* 없으면 도메인 이름 같은 긴 글자가 칸을 밀어내 오른쪽을 찌그러뜨린다 */
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      /* ── 헤더 ── */

      .head {
        padding: 14px 16px 12px;
        border-bottom: 1px solid var(--rule);
      }

      .head-main {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .head-cat {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex: none;
      }

      .dot-live {
        background: var(--live);
      }

      .dot-idle {
        background: var(--faint);
      }

      .head-sub {
        margin-top: 3px;
        font-size: 12px;
        color: var(--sub);
        font-variant-numeric: tabular-nums;
      }

      /* ── 새 키 발급 경고 ── */

      .notice {
        padding: 12px 16px 13px;
        background: var(--drop-bg);
        border-bottom: 1px solid var(--rule);
      }

      .notice-t {
        font-weight: 700;
        color: var(--drop);
        margin-bottom: 4px;
      }

      .notice-s {
        font-size: 12px;
        color: var(--sub);
        line-height: 1.55;
      }

      .notice-actions {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }

      .btn {
        flex: 1;
        padding: 6px 8px;
        font: inherit;
        font-size: 12px;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--rule);
        border-radius: 6px;
        cursor: pointer;
      }

      .btn:hover {
        border-color: var(--faint);
      }

      .btn-main {
        font-weight: 650;
        color: var(--bg);
        background: var(--drop);
        border-color: var(--drop);
      }

      .btn-main:hover {
        opacity: 0.88;
      }

      /* ── 확장 키 확인·변경 ── */

      .krest {
        padding: 8px 16px 10px;
        border-bottom: 1px solid var(--rule);
      }

      .krest-link {
        padding: 0;
        font: inherit;
        font-size: 11.5px;
        color: var(--faint);
        background: none;
        border: 0;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .krest-link:hover {
        color: var(--fg);
      }

      .krest-t {
        font-weight: 700;
        margin-bottom: 4px;
      }

      .krest-s {
        font-size: 11.5px;
        color: var(--sub);
        line-height: 1.55;
        margin-bottom: 8px;
      }

      /* 적어두라고 보여주는 값이다 — 드래그로 집히고, 길면 줄바꿈된다. */
      .krest-now {
        padding: 6px 8px;
        margin-bottom: 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
        color: var(--fg);
        background: var(--drop-bg);
        border-radius: 6px;
        word-break: break-all;
        user-select: all;
      }

      .krest-m {
        margin-top: 8px;
        font-size: 11.5px;
        line-height: 1.5;
      }

      .krest-bad {
        color: var(--drop);
      }

      .krest-good {
        color: var(--live);
      }

      /* ── 전송 미리보기 ── */

      .verdict {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--rule);
      }

      .verdict-ok {
        background: var(--live-bg);
      }

      .verdict-skip {
        background: var(--drop-bg);
      }

      .verdict-k {
        font-size: 11px;
        color: var(--sub);
      }

      .verdict-v {
        font-size: 13px;
        font-weight: 700;
        text-align: right;
      }

      .verdict-ok .verdict-v {
        color: var(--live);
      }

      .verdict-skip .verdict-v {
        color: var(--drop);
      }

      /* ── 지표 ── */

      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        background: var(--rule);
        border-bottom: 1px solid var(--rule);
      }

      .stat {
        background: var(--bg);
        padding: 9px 16px;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .stat-k {
        font-size: 10.5px;
        color: var(--faint);
      }

      .stat-v {
        font-size: 15px;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
      }

      /* ── 블록 ── */

      .block {
        padding: 11px 16px;
        border-bottom: 1px solid var(--rule);
      }

      .block-h {
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
        margin-bottom: 7px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 2px 0;
      }

      .row-k {
        color: var(--sub);
      }

      .row-v {
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .row-warn {
        color: var(--warn);
        font-weight: 600;
      }

      /* ── 도메인 막대 ── */

      .bar-row {
        display: grid;
        /* 320px 시절엔 96px 이 최선이었다. 칸이 넓어졌으니 이름을 살린다 —
           "platform.opena…" 와 "platform.openai.com" 은 읽는 값이 다르다. */
        grid-template-columns: 150px 1fr 44px;
        align-items: center;
        gap: 8px;
        padding: 3px 0;
      }

      .bar-k {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
      }

      .bar {
        height: 5px;
        background: var(--sunken);
        border-radius: 3px;
        overflow: hidden;
      }

      .bar-fill {
        height: 100%;
        background: var(--live);
        opacity: 0.75;
      }

      .bar-v {
        font-size: 11px;
        color: var(--sub);
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      /* ── 태그 ── */

      .marks {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--rule);
      }

      .tag {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--drop-bg);
        color: var(--drop);
      }

      .tag-quiet {
        background: var(--sunken);
        color: var(--sub);
      }

      /* ── API 사용량 ── */

      .usage {
        width: 236px;
        flex: none;
        padding: 12px 16px 14px;
        /* 세로 줄 하나로 두 칸을 가른다. align-items:stretch 덕에 짧은 쪽도
           바닥까지 따라 내려간다 — 줄이 중간에서 끊기면 칸이 아니라 그냥
           떠 있는 상자로 보인다. */
        border-left: 1px solid var(--rule);
      }

      .u-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        /* 좁은 칸이라 한 줄에 다 못 들어가는 날이 있다. 그때는 잘리는 대신
           접힌다 — 갱신·키 버튼이 사라지면 손쓸 방법이 없어진다. */
        flex-wrap: wrap;
        gap: 8px;
        row-gap: 2px;
        margin-bottom: 8px;
      }

      .u-head .block-h {
        margin-bottom: 0;
      }

      .u-head-r {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .u-since {
        font-size: 10.5px;
        color: var(--faint);
      }

      /* 버튼처럼 안 보이는 버튼 — 이 화면의 주인공은 숫자다 */
      .u-link {
        font: inherit;
        font-size: 11px;
        color: var(--sub);
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .u-link:hover {
        color: var(--fg);
      }

      .u-item + .u-item {
        margin-top: 9px;
        padding-top: 9px;
        border-top: 1px solid var(--rule);
      }

      .u-top {
        display: grid;
        /* 가운데 칸이 남는 자리를 다 먹는다 — 막대가 있든 없든 이름과
           금액의 자리가 안 흔들린다. */
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 8px;
      }

      .u-name {
        font-size: 12.5px;
        font-weight: 600;
      }

      /* 큰 숫자 + 그게 뭔지. 세로로 쌓아 오른쪽 정렬한다 — 좁은 칸에서
         이름을 옆에 두면 금액이 밀려 줄바꿈된다. */
      .u-amt-box {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        line-height: 1.2;
      }

      .u-amt {
        font-size: 15px;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
      }

      .u-amt-k {
        font-size: 9.5px;
        letter-spacing: 0.04em;
        color: var(--faint);
      }

      .u-amt-none {
        font-size: 13px;
        font-weight: 400;
        color: var(--faint);
      }

      .u-spark {
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        gap: 1.5px;
        height: 16px;
      }

      .u-bar {
        width: 3px;
        background: var(--live);
        opacity: 0.65;
        border-radius: 1px;
      }

      .u-bar-zero {
        background: var(--rule);
        opacity: 1;
      }

      .u-sub {
        margin-top: 2px;
        font-size: 11.5px;
        color: var(--sub);
        font-variant-numeric: tabular-nums;
      }

      .u-quiet {
        color: var(--faint);
      }

      .u-err {
        color: var(--warn);
        line-height: 1.45;
      }

      button.u-sub {
        display: block;
        font-family: inherit;
        background: none;
        border: 0;
        padding: 0;
        text-align: left;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .u-total {
        margin-top: 9px;
        padding-top: 7px;
        border-top: 1px solid var(--rule);
        font-size: 11.5px;
        color: var(--sub);
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      /* ── 키 입력 ── */

      .keys-f + .keys-f {
        margin-top: 10px;
      }

      .keys-l {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 4px;
      }

      .keys-i {
        width: 100%;
        padding: 6px 8px;
        font: inherit;
        font-size: 12px;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--rule);
        border-radius: 6px;
      }

      .keys-i:focus {
        outline: none;
        border-color: var(--live);
      }

      /* 구독료는 비밀이 아니라 상수다 — 가리지 않고 그대로 보인다.
         그래야 지우려는 건지 안 건드린 건지가 눈에 보인다. */
      .keys-money {
        margin-top: 5px;
        font-variant-numeric: tabular-nums;
      }

      .keys-h {
        margin-top: 3px;
        font-size: 10.5px;
        color: var(--faint);
        line-height: 1.4;
      }

      .keys-h-warn {
        color: var(--warn);
      }

      .keys-drop {
        margin-top: 3px;
      }

      /* ── 빈 상태 ── */

      .empty {
        padding: 30px 20px 26px;
        text-align: center;
      }

      .empty-mark {
        font-size: 22px;
        color: var(--faint);
        line-height: 1;
        margin-bottom: 10px;
      }

      .empty-t {
        font-weight: 650;
        margin-bottom: 4px;
      }

      .empty-s {
        font-size: 12px;
        color: var(--sub);
      }

      /* ── 푸터 ── */

      .foot {
        padding: 10px 16px 12px;
        background: var(--sunken);
        /* 오른쪽 칸이 더 길면 왼쪽 아래에 빈 흰 띠가 남는다. 푸터를 바닥으로
           밀어 그 자리를 채운다 — 세션이 없는 날(빈 상태)이 특히 그렇다. */
        margin-top: auto;
      }

      .foot-row {
        font-size: 11px;
        color: var(--sub);
        font-variant-numeric: tabular-nums;
      }

      .foot-warn {
        color: var(--warn);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
